# Server Configuration
server.port=3000

# Virtual Threads for High-Throughput Concurrency (Java 21)
spring.threads.virtual.enabled=true

# Static Resources
spring.web.resources.static-locations=file:../aura-platform/public/,classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# MongoDB Configuration (defaults to local; fallback in-memory is automatically active if offline)
spring.data.mongodb.uri=mongodb://localhost:27017/aura_finance
spring.data.mongodb.auto-index-creation=true

# Azure OpenAI / OpenAI Settings (read from environment or default)
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:https://your-resource.openai.azure.com/}
azure.openai.key=${AZURE_OPENAI_API_KEY:}
azure.openai.deployment=${AZURE_OPENAI_CHATGPT_DEPLOYMENT:gpt-4.1}
azure.openai.model=${AZURE_OPENAI_CHATGPT_MODEL:gpt-4.1}
azure.openai.api-version=${AZURE_OPENAI_API_VERSION:2025-01-01-preview}

openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o}

# Fi MCP Service Configuration
fi.mcp.url=${FI_MCP_URL:https://fi-mcp-server-fnfkgsazeudpdcd2.centralindia-01.azurewebsites.net}

# Fallback Settings
silent.fallback=${SILENT_FALLBACK:true}

# Socket.IO Configuration
socketio.host=0.0.0.0
socketio.port=3001

# Logging
logging.level.com.aura=INFO
logging.level.org.springframework=WARN
logging.level.com.corundumstudio.socketio=WARN
